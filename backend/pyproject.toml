[project]
name = "aftersales-mock-service"
version = "0.1.0"
description = "Mock business service for the aftersales agent: order, logistics, address, refund with fault injection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # uvicorn 不带 WebSocket 实现，缺失时 /ws/* 全部 404（006 实时通道依赖）
    "websockets>=13.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
]
# 镜像运行 dev_server 用（镜像内不带 Redis，由 fakeredis 顶替）。
# 不能塞进 dev：镜像只装运行期依赖，dev 组不该进生产镜像。
serve = [
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
