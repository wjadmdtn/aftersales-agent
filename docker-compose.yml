services:
  mock-service:
    # 上下文是仓库根：多阶段构建要同时拿到 frontend/ 与 backend/
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MOCK_SEED_PATH: seed/orders.json
      MOCK_FAULT_ENABLED: "true"
      MOCK_DEBUG_ENDPOINTS_ENABLED: "true"
      MOCK_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aftersales
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aftersales"]
      interval: 10s
      timeout: 3s
      retries: 5
